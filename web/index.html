<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播客系统 - Podcast Platform</title>
<link rel="stylesheet" href="/static/assets/css/style.css">
</head>
<body>
<nav class="navbar"><div class="navbar-inner">
  <a href="/" class="logo">🎙️ Podcast</a>
  <div class="nav-links">
    <a href="/login">登录</a>
    <a href="/register">注册</a>
  </div>
</div></nav>
<section style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:100px 0">
<div class="container" style="text-align:center">
  <h1 style="font-size:48px;margin-bottom:20px">创建属于你的播客</h1>
  <p style="font-size:20px;margin-bottom:40px;opacity:.9">一站式播客托管、RSS分发、收听分析与互动平台</p>
  <div>
    <a href="/register" class="btn btn-lg" style="background:#fff;color:#6366f1">开始创建</a>
    <a href="/login" class="btn btn-lg btn-secondary" style="margin-left:12px">登录后台</a>
  </div>
</div>
</section>
<section class="container page">
<div class="grid grid-3">
  <div class="card"><h3 style="margin-bottom:12px">🎙️ 节目管理</h3><p style="color:var(--muted)">批量上传音频、自动解析元数据、章节管理、定时发布</p></div>
  <div class="card"><h3 style="margin-bottom:12px">📡 RSS 分发</h3><p style="color:var(--muted)">iTunes 兼容、自动缓存、订阅链接生成、订阅者邮件列表</p></div>
  <div class="card"><h3 style="margin-bottom:12px">📊 数据分析</h3><p style="color:var(--muted)">收听统计、地域分布、完播率、趋势图表、CSV 导出</p></div>
  <div class="card"><h3 style="margin-bottom:12px">💬 听众互动</h3><p style="color:var(--muted)">评论、评分、弹幕、点赞、审核管理</p></div>
  <div class="card"><h3 style="margin-bottom:12px">🔐 权限系统</h3><p style="color:var(--muted)">用户注册登录、JWT 认证、管理员审核、内容管控</p></div>
  <div class="card"><h3 style="margin-bottom:12px">⏰ 定时任务</h3><p style="color:var(--muted)">自动发布节目、RSS 缓存刷新、数据聚合</p></div>
</div>
</section>
<script src="/static/assets/js/app.js"></script>
</body>
</html>
